<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Gwaso Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Espace d'administration de Gwaso, l'application de cuisine malienne."
    />
    <!-- Espace privé : il ne doit pas apparaître dans les moteurs de recherche -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3b2f29" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Thème choisi (clair / sombre) appliqué avant l'affichage : pas d'éclair blanc au chargement -->
    <script>
      try {
        var t = localStorage.getItem('gwaso.theme');
        if (t === 'sombre') document.documentElement.setAttribute('data-theme', 'dark');
        if (t === 'clair') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Gwaso Admin a besoin de JavaScript pour fonctionner.</noscript>
  </body>
</html>
