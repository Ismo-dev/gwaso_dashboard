<h2 mat-dialog-title>{{ donnees.ingredient ? "Modifier l'ingrédient" : 'Nouvel ingrédient' }}</h2>
<mat-dialog-content>
  <app-ingredient-formulaire
    [ingredient]="donnees.ingredient"
    [nomInitial]="donnees.nomInitial ?? ''"
    (enregistre)="fenetre.close($event)"
    (annule)="fenetre.close($event ?? undefined)"
  />
</mat-dialog-content>
